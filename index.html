
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT & FV PRO - Neural Discovery Suite</title>
    <meta name="description" content="Enterprise-grade AI suite for YouTube dominance and Fiverr excellence. Powered by Neural Discovery Engine v6.0.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #A855F7; /* Violet-500 */
            --secondary: #06B6D4; /* Cyan-500 */
            --bg-dark: #020617; /* Slate-950 */
        }
        body { 
          font-family: 'Space Grotesk', 'Inter', sans-serif; 
          background: var(--bg-dark); 
          color: white; 
          overflow-x: hidden; 
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
        
        @keyframes marquee {
          0% { transform: translateX(0); }
          100% { transform: translateX(-50%); }
        }
        .animate-marquee {
          display: flex;
          width: 200%;
          animation: marquee 30s linear infinite;
        }
        
        .violet-glow { box-shadow: 0 0 40px rgba(168, 85, 247, 0.15); }
        .cyan-glow { box-shadow: 0 0 40px rgba(6, 182, 212, 0.15); }

        .neural-report p { margin-bottom: 1.5rem; }
        .neural-report strong { color: var(--secondary); font-weight: 700; }
        .neural-report h1, .neural-report h2, .neural-report h3 { 
          color: var(--primary); 
          font-weight: 800; 
          text-transform: uppercase; 
          margin-top: 2rem;
          margin-bottom: 1rem;
        }

        /* Responsive Fixes */
        .glass-panel {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        @media (max-width: 768px) {
            .hero-text { font-size: 3.5rem !important; line-height: 1 !important; }
            .tool-grid { grid-template-columns: 1fr !important; }
        }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
      }
    }
    </script>
</head>
<body class="custom-scrollbar selection:bg-purple-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
